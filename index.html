<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>芥桜木ユノ｜制作依頼サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#fffdfa;
    --paper:#fbf8f2;
    --ink:#3c352f;
    --ink-soft:#6b6259;
    --line:#e7ded1;
    --pink:#f3d7dd;
    --pink-deep:#d99aa9;
    --yellow:#f2e6b8;
    --yellow-deep:#c9a94a;
    --check-ink:#fff;
    --note-ink:#6b5a1f;
    --serif: "Noto Serif JP", serif;
    --sans: "Zen Kaku Gothic New", sans-serif;
    --shadow: 0 1px 0 rgba(60,53,47,0.06);
  }
  /* スマホ・PCがダークモードの場合は色を反転させ、白背景×黒文字にならないようにする */
  @media (prefers-color-scheme: dark){
    :root{
      --white:#221f1b;
      --paper:#2b2721;
      --ink:#f4efe6;
      --ink-soft:#c9c0b2;
      --line:#453f37;
      --pink:#5a3a42;
      --pink-deep:#e6a9b8;
      --yellow:#4d4326;
      --yellow-deep:#e0c268;
      --check-ink:#221f1b;
      --note-ink:#f4e9c8;
      --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
    .lightbox-inner img, .lightbox-inner video{ background:#000; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  .wrap{max-width:860px;margin:0 auto;padding:0 24px;}
  .wrap-narrow{max-width:640px;margin:0 auto;padding:0 24px;}

  /* ---------- header ---------- */
  header.site-header{
    padding:28px 24px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-size:19px;
    letter-spacing:.12em;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand small{
    font-family:var(--sans);
    font-size:10px;
    letter-spacing:.18em;
    color:var(--ink-soft);
  }
  nav.top-nav{display:flex; gap:22px; font-family:var(--sans); font-size:13px; letter-spacing:.04em;}
  nav.top-nav span{cursor:pointer; color:var(--ink-soft); padding-bottom:4px; border-bottom:1px solid transparent; transition:.25s;}
  nav.top-nav span:hover{color:var(--ink); border-color:var(--pink-deep);}
  @media (max-width:640px){ nav.top-nav{display:none;} }

  /* ---------- generic section ---------- */
  section{padding:64px 0;}
  .eyebrow-line{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.22em;
    color:var(--pink-deep);
    margin:0 0 6px;
  }
  h1.page-title{
    font-size:30px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:.03em;
  }
  .page-title-sub{
    font-family:var(--sans);
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin:0 0 40px;
  }
  h2.block-title{
    font-size:20px;
    font-weight:600;
    margin:0 0 2px;
  }
  .block-title-en{
    font-family:var(--sans);
    font-size:10px;
    letter-spacing:.22em;
    color:var(--pink-deep);
  }
  .block-head{margin-bottom:26px;}

  hr.div{border:none; border-top:1px solid var(--line); margin:56px 0;}

  /* ---------- home ---------- */
  .hero{padding:72px 0 20px; text-align:center;}
  .hero-kicker{font-family:var(--sans); font-size:11px; letter-spacing:.3em; color:var(--pink-deep); margin-bottom:14px;}
  .hero h1{font-size:32px; font-weight:600; margin:0 0 14px; letter-spacing:.06em;}
  .hero p{color:var(--ink-soft); font-size:14px; max-width:440px; margin:0 auto;}

  .service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin:48px 0 8px;
  }
  @media (max-width:720px){ .service-grid{grid-template-columns:1fr;} }
  .service-card{
    border:1px solid var(--line);
    background:var(--paper);
    padding:34px 24px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    position:relative;
  }
  .service-card:hover{border-color:var(--pink-deep); background:var(--white); box-shadow:0 8px 24px rgba(60,53,47,0.06);}
  .service-card .badge{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,var(--pink),var(--yellow));
    margin:0 auto 18px;
  }
  .service-card h3{font-size:17px; margin:0 0 8px; font-weight:600;}
  .service-card p{font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 18px;}
  .service-card .go{
    font-family:var(--sans); font-size:11px; letter-spacing:.1em; color:var(--pink-deep);
  }

  .profile-box{
    margin-top:60px;
    display:flex;
    gap:24px;
    align-items:center;
    justify-content:center;
    padding:28px;
    border:1px solid var(--line);
  }
  .profile-icon{
    width:76px;height:76px;flex:0 0 76px;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--sans); font-size:9px; color:var(--ink-soft);
    overflow:hidden;
  }
  .profile-icon img{width:100%;height:100%;object-fit:cover;}
  .profile-text{text-align:center;}
  .profile-text h3{margin:0 0 6px; font-size:16px;}
  .profile-text p{margin:0; font-size:13px; color:var(--ink-soft); white-space:pre-line;}
  @media (max-width:520px){ .profile-box{flex-direction:column; text-align:center;} }

  /* ---------- breadcrumb / back ---------- */
  .back-link{
    font-family:var(--sans); font-size:12px; color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; margin-bottom:28px;
  }
  .back-link:hover{color:var(--pink-deep);}

  /* ---------- portfolio ---------- */
  .portfolio-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  @media (min-width:600px){ .portfolio-grid{grid-template-columns:repeat(3,1fr);} }
  .portfolio-item{
    aspect-ratio:1/1;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .portfolio-item img,.portfolio-item video{width:100%;height:100%;object-fit:cover;}
  .noimage-label{font-family:var(--sans); font-size:11px; color:var(--ink-soft); letter-spacing:.08em;}
  .portfolio-caption{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(255,253,250,.85);
    font-family:var(--sans); font-size:10px; letter-spacing:.04em;
    padding:5px 8px; color:var(--ink-soft);
  }

  /* ---------- plan cards ---------- */
  .plan-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media (max-width:760px){ .plan-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .plan-grid{grid-template-columns:1fr;} }
  .plan-card{
    border:2px solid var(--line);
    padding:26px 22px;
    cursor:pointer;
    transition:.25s;
    background:var(--white);
    position:relative;
  }
  .plan-card.selected{
    border-color:var(--pink-deep);
    background:linear-gradient(180deg,rgba(243,215,221,.35),rgba(255,255,255,0));
  }
  .plan-card .plan-check{
    position:absolute; top:16px; right:16px;
    width:18px;height:18px;border-radius:50%;
    border:1px solid var(--ink-soft);
  }
  .plan-card.selected .plan-check{background:var(--pink-deep); border-color:var(--pink-deep);}
  .plan-name{font-size:16px; font-weight:600; margin:0 0 6px;}
  .plan-price{font-family:var(--sans); font-weight:900; font-size:24px; margin:0 0 10px; color:var(--ink);}
  .plan-price small{font-size:12px; font-weight:500; color:var(--ink-soft);}
  .plan-desc{font-family:var(--sans); font-size:12px; color:var(--ink-soft); margin:0;}

  /* ---------- options ---------- */
  .options-panel{margin-top:32px; transition:opacity .25s;}
  .options-panel.locked{opacity:.35; pointer-events:none;}
  .option-row{
    display:flex; align-items:center; gap:16px;
    padding:16px 4px; border-bottom:1px solid var(--line);
  }
  .option-thumb{
    width:56px;height:56px;flex:0 0 56px;
    background:var(--paper); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center; overflow:hidden;
    cursor:zoom-in;
  }
  .option-thumb img,.option-thumb video{width:100%;height:100%;object-fit:cover;}
  .option-thumb span{font-family:var(--sans); font-size:8px; color:var(--ink-soft);}
  .option-main{flex:1; min-width:0;}
  .option-name{font-size:14.5px;}
  .option-price{font-family:var(--sans); font-size:12px; color:var(--ink-soft);}
  .option-control{flex:0 0 auto;}
  .chk{
    width:22px;height:22px;border:1px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; transition:.2s;
  }
  .chk.on{background:var(--pink-deep); border-color:var(--pink-deep); color:var(--check-ink); font-size:13px;}
  .qty{display:flex; align-items:center; gap:10px; font-family:var(--sans);}
  .qty button{
    width:26px;height:26px;border:1px solid var(--ink-soft);
    background:var(--white); font-size:15px; line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .qty button:disabled{opacity:.3; cursor:default;}
  .qty .qty-num{min-width:34px; text-align:center; font-size:13px;}

  .plan-note{
    margin-top:18px; padding:12px 16px;
    background:var(--yellow); font-family:var(--sans); font-size:12px;
    color:var(--note-ink); border-left:3px solid var(--yellow-deep);
  }

  /* ---------- total ---------- */
  .total-box{
    margin-top:36px; padding:28px;
    border:1px solid var(--ink);
    background:var(--paper);
    text-align:right;
  }
  .total-label{font-family:var(--sans); font-size:11px; letter-spacing:.15em; color:var(--ink-soft);}
  .total-amount{font-family:var(--sans); font-weight:900; font-size:34px; margin:4px 0 14px;}
  .installments{font-family:var(--sans); font-size:11.5px; color:var(--ink-soft);}
  .installments b{color:var(--ink); font-weight:700;}

  /* ---------- form ---------- */
  .form-block{margin-top:8px;}
  .form-row{margin-bottom:24px;}
  .form-label{
    display:block; font-family:var(--sans); font-size:12px; letter-spacing:.05em;
    color:var(--ink-soft); margin-bottom:8px;
  }
  select,input[type="text"],input[type="date"],textarea{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--ink);
    border:1px solid var(--line); background:var(--white);
    padding:11px 12px; outline:none;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--pink-deep);}
  textarea{resize:vertical; min-height:80px;}
  .radio-pill-row{display:flex; flex-wrap:wrap; gap:10px;}
  .radio-pill{
    font-family:var(--sans); font-size:12.5px; padding:9px 16px;
    border:1px solid var(--line); cursor:pointer; transition:.2s;
  }
  .radio-pill.selected{border-color:var(--pink-deep); background:var(--pink); }
  .date-hint{margin:8px 0 0; font-family:var(--sans); font-size:11.5px; color:var(--pink-deep);}
  .no-pref-row{margin-top:10px; display:flex; align-items:center; gap:8px; font-family:var(--sans); font-size:12.5px; color:var(--ink-soft);}
  .no-pref-row input{width:auto;}

  /* ---------- generated text ---------- */
  .gen-box{
    margin-top:20px;
    border:1px solid var(--line);
    background:var(--paper);
    padding:24px;
    white-space:pre-wrap;
    font-family:var(--sans);
    font-size:13.5px;
    line-height:2;
    color:var(--ink);
  }
  .copy-btn{
    margin-top:16px;
    width:100%;
    padding:16px;
    background:var(--ink);
    color:var(--white);
    border:none;
    font-family:var(--sans);
    font-size:14px;
    letter-spacing:.08em;
    font-weight:700;
    transition:.2s;
  }
  .copy-btn:hover{background:var(--pink-deep);}
  .copy-btn.copied{background:var(--yellow-deep);}
  .copy-hint{
    text-align:center; font-family:var(--sans); font-size:12px;
    color:var(--ink-soft); margin:14px 0 0;
  }

  .sns-row{display:flex; gap:14px; margin-top:20px; flex-wrap:wrap;}
  .sns-btn{
    flex:1; min-width:150px; text-align:center; text-decoration:none;
    padding:16px; border:1px solid var(--ink); font-family:var(--sans);
    font-size:13px; letter-spacing:.06em; color:var(--ink); transition:.2s;
  }
  .sns-btn:hover{background:var(--ink); color:var(--white);}

  /* ---------- terms ---------- */
  .terms-box{margin-top:44px; font-family:var(--sans);}
  .terms-box h4{
    font-size:12.5px; letter-spacing:.08em; margin:22px 0 8px; color:var(--ink);
    border-left:3px solid var(--pink-deep); padding-left:10px;
  }
  .terms-box ul{margin:0; padding-left:1.3em; font-size:12px; color:var(--ink-soft); line-height:1.9;}

  /* ---------- cta / other services ---------- */
  .other-cta{
    margin-top:64px; padding:40px 28px; text-align:center;
    background:linear-gradient(135deg, rgba(243,215,221,.5), rgba(242,230,184,.5));
    border:1px solid var(--line);
  }
  .other-cta p{margin:0 0 20px; font-size:14.5px;}
  .other-cta-links{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .other-cta-links span{
    font-family:var(--sans); font-size:12.5px; padding:11px 22px;
    border:1px solid var(--ink); cursor:pointer; background:var(--white); transition:.2s;
  }
  .other-cta-links span:hover{background:var(--ink); color:var(--white);}

  /* ---------- price table (design) ---------- */
  .price-table{width:100%; border-collapse:collapse; font-family:var(--sans); font-size:13.5px;}
  .price-table td{padding:14px 6px; border-bottom:1px solid var(--line);}
  .price-table td:last-child{text-align:right; font-weight:700;}

  .price-note-list{list-style:none; margin:0; padding:0;}
  .price-note-list li{
    padding:18px 0; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  }
  .price-note-list .pn-name{font-size:14.5px;}
  .price-note-list .pn-note{font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); display:block; margin-top:4px;}
  .price-note-list .pn-price{font-family:var(--sans); font-weight:700; font-size:15px; white-space:nowrap;}
  .price-common-note{
    margin-top:16px; font-family:var(--sans); font-size:12px; color:var(--ink-soft);
    padding-top:14px; border-top:1px solid var(--line);
  }

  footer{padding:40px 24px 60px; text-align:center; font-family:var(--sans); font-size:11px; color:var(--ink-soft);}

  /* ---------- lightbox ---------- */
  .portfolio-item{cursor:zoom-in;}
  .lightbox{
    position:fixed; inset:0; z-index:999;
    background:rgba(30,26,22,.92);
    display:flex; align-items:center; justify-content:center;
    padding:40px 24px;
  }
  .lightbox.hidden{display:none;}
  .lightbox-inner{max-width:min(90vw,720px); max-height:85vh; text-align:center;}
  .lightbox-inner img, .lightbox-inner video{
    max-width:100%; max-height:78vh; width:auto; margin:0 auto;
    background:#111;
  }
  .yt-wrap{
    position:relative; width:min(90vw,720px); aspect-ratio:16/9; margin:0 auto; background:#000;
  }
  .yt-wrap.vertical{ width:min(44vh,90vw); aspect-ratio:9/16; }
  .yt-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .play-badge{
    position:absolute; inset:0; margin:auto; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; padding-left:2px; pointer-events:none;
  }
  .option-thumb{ position:relative; }
  .option-thumb .play-badge{ width:22px; height:22px; font-size:9px; }
  .lightbox-noimage{
    width:min(80vw,480px); aspect-ratio:1/1; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); font-size:13px; color:var(--ink-soft); margin:0 auto;
  }
  .lightbox-caption{
    margin-top:16px; font-family:var(--sans); font-size:12.5px; color:#f2ece2; letter-spacing:.04em;
  }
  .lightbox-close{
    position:fixed; top:20px; right:26px; color:#fff; font-size:30px; line-height:1;
    cursor:pointer; z-index:1000; font-family:var(--sans); font-weight:300;
  }
</style>
</head>
<body>

<main id="app"></main>

<div id="lightbox" class="lightbox hidden" onclick="closeLightbox(event)">
  <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
  <div class="lightbox-inner" id="lightboxInner"></div>
</div>

<footer>&copy; <span id="year"></span> Yuno Akezakuragi</footer>

<script>
/* =========================================================================
   ▼▼▼ サイトの内容データ（このブロックを編集すれば内容を更新できます） ▼▼▼
   ========================================================================= */
/* =========================================================================
   config.js — サイトの内容データ（index.html の中にも同じ内容が入っています）

   ▼ 画像・動画を差し替えたいとき
     image: "" のままだと「NoImage」表示になります。
     image: "画像のURL" のように書き換えると、その画像が表示されます。
     （画像ファイルは同じフォルダに置いて image: "sample1.jpg" のように
      ファイル名を書いてもOKです）
     動画ファイル（.mp4 / .webm / .mov）も同じ書き方で再生されます。

   ▼ YouTube動画を載せたいとき
     image: "https://www.youtube.com/watch?v=xxxxxxxxxxx" のように、
     YouTubeのURLをそのまま貼るだけでOKです。
     （youtu.be の短縮URL・shorts のURLも使えます）
     小さな枠にはサムネイルが出て、タップすると拡大して動画が再生されます。
     YouTubeには「限定公開」でアップロードしておくのがおすすめです。

   ▼ オプションを追加・削除・並べ替えしたいとき
     live2d.plans.tsumekomi.options の配列に { } の項目を増やす/減らす/
     順番を入れ替えるだけで反映されます。

   ▼ 料金を変えたいとき
     price の数字を書き換えるだけでOKです（円マークは自動で付きます）。
   ========================================================================= */

const SITE_CONFIG = {

  /* ---------------- プロフィール ---------------- */
  profile: {
    name: "芥桜木ユノ",
    bio: "Live2d制作、動画制作、デザイン、その他もろもろの制作をしてます！\nお気軽にご連絡ください！",
    icon: "profile.png" // アイコン画像URL。空ならNoImage表示
  },

  /* ---------------- 外部リンク ---------------- */
  links: {
    x: "https://twitter.com/yuno_vtb",
    coconalaLive2D: "https://coconala.com/users/3622828", // ココナラ プロフィール
    coconalaLogo: "https://coconala.com/users/3622828"    // ココナラ プロフィール
  },

  /* ---------------- 注意事項・利用規約（全ページ共通） ---------------- */
  terms: [
    {
      title: "納期について",
      items: [
        "制作内容や修正内容によって、ご希望の納期から変更になる場合があります。",
        "過度な修正や、制作中の不慮の事故・トラブル等が発生した場合、予定していた納期より遅れる場合がございます。",
        "納期に余裕を持ってご依頼いただきますようお願いいたします。"
      ]
    },
    {
      title: "お支払いについて",
      items: [
        "お支払い方法は、銀行振込・アズカリ・ココナラに対応しております。",
        "銀行振込の場合、振込手数料はご依頼者様のご負担となります。",
        "お支払い後のキャンセル・返金はお受けできません。"
      ]
    },
    {
      title: "制作物について",
      items: [
        "納品した制作物の無断での再配布・販売・譲渡・自作発言等は禁止しております。",
        "制作物の著作権は放棄しておりません。",
        "制作物の使用範囲については、ご依頼内容に応じて別途ご案内いたします。"
      ]
    },
    {

function yen(n){ return "¥" + Number(n).toLocaleString("ja-JP"); }

// YouTubeのURLから動画IDを取り出す（watch?v= / youtu.be / shorts / embed / live に対応）
function youtubeId(url){
  if(!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function isYoutubeShorts(url){ return /youtube\.com\/shorts\//.test(url || ""); }

function mediaBox(item, sizeClass){
  if(item && item.image){
    const yt = youtubeId(item.image);
    if(yt){
      // YouTubeは小さな枠にはサムネイル＋再生マークだけを表示（重くならないように）
      return `<img src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="${item.caption||''}"><span class="play-badge">▶</span>`;
    }
    const isVideo = /\.(mp4|webm|mov)$/i.test(item.image);
    return isVideo
      ? `<video src="${item.image}" muted loop autoplay playsinline></video>`
      : `<img src="${item.image}" alt="${item.caption||''}">`;
  }
  return `<span class="noimage-label">NoImage</span>`;
}

function portfolioGrid(list, groupId){
  return `<div class="portfolio-grid">${
    list.map((p,i) => `
      <div class="portfolio-item" onclick="openLightbox('${groupId}', ${i})">
        ${mediaBox(p)}
        ${p.caption ? `<div class="portfolio-caption">${p.caption}</div>` : ``}
      </div>`).join("")
  }</div>`;
}

function openLightboxItem(item, captionText){
  const inner = document.getElementById("lightboxInner");
  let mediaHTML;
  if(item && item.image){
    const yt = youtubeId(item.image);
    if(yt){
      const vertical = isYoutubeShorts(item.image) ? " vertical" : "";
      mediaHTML = `<div class="yt-wrap${vertical}"><iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0&playsinline=1" title="${captionText||'YouTube'}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
    } else if(/\.(mp4|webm|mov)$/i.test(item.image)){
      mediaHTML = `<video src="${item.image}" controls autoplay playsinline></video>`;
    } else {
      mediaHTML = `<img src="${item.image}" alt="${captionText||''}">`;
    }
  } else {
    mediaHTML = `<div class="lightbox-noimage">NoImage</div>`;
  }
  inner.innerHTML = mediaHTML + (captionText ? `<div class="lightbox-caption">${captionText}</div>` : "");
  document.getElementById("lightbox").classList.remove("hidden");
}

function doCopy(id){
  const text = document.getElementById("genText-"+id).innerText;
  const btn = document.getElementById("copyBtn-"+id);
  const finish = ()=>{
    btn.textContent = "コピーしました！";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent="この依頼文をコピーする"; btn.classList.remove("copied"); }, 1800);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(finish).catch(()=>fallbackCopy(text,finish));
  } else {
    fallbackCopy(text, finish);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

/* ---------- 希望納期：最短で選べる日付の計算 ---------- */
function pad2(n){ return String(n).padStart(2,"0"); }
function toISODate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function addDays(base, days){ const d = new Date(base); d.setDate(d.getDate()+days); return d; }
function formatMonthDay(isoStr){
  const d = new Date(isoStr+"T00:00:00");
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

// 今日からNヶ月後 / N日後 の日付をYYYY-MM-DD形式で返す
function minDateAfterDays(days){ return toISODate(addDays(new Date(), days)); }

// デザインページ：選んだ制作物によって最短納期の日数が変わる（config.js の design.prices / otherMinLeadDays を参照）
function designMinLeadDays(item){
  const cfg = SITE_CONFIG.design;
  if(item === "その他") return cfg.otherMinLeadDays || 30;
  const found = cfg.prices.find(p => p.name === item);
  return found ? (found.minLeadDays || 30) : 30; // 未選択時は最も慎重な日数を基準にする
}

// 各ページの希望納期に適用する最短日付（config.js の minLeadDays を参照）
function minDateFor(pageKey){
  if(pageKey === "live2d") return minDateAfterDays(SITE_CONFIG.live2d.minLeadDays || 30);
  if(pageKey === "video")  return minDateAfterDays(SITE_CONFIG.video.minLeadDays || 30);
  if(pageKey === "design") return minDateAfterDays(designMinLeadDays(state.design.item));
  return null;
}

function deliveryFieldHTML(pageKey, dateVal, noPref){
  const min = minDateFor(pageKey);
  // 制作物の選び直し等で、既に入力済みの日付が最短納期より前になっていたら自動でクリアする
  if(!noPref && dateVal && min && dateVal < min){
    state[pageKey].deliveryDate = "";
    dateVal = "";
  }
  return `
    <div class="form-row">
      <label class="form-label">希望納期</label>
      <input type="date" value="${dateVal}" ${min?`min="${min}"`:""} ${noPref?"disabled":""}
        oninput="updateField('${pageKey}','deliveryDate',this.value)">

      <div class="no-pref-row">

}

  // (フルレンダーすると入力中のフォーカスが外れたり、スクロール位置がずれるため)

// 全力プラン／詰め込みプラン部分の合計（ミニキャラLive2dは含まない）
function live2dMainPlanTotal(){
  const s = state.live2d;
  const cfg = SITE_CONFIG.live2d;
  if(s.plan === "zenryoku") return cfg.plans.zenryoku.price;
  if(s.plan === "tsumekomi"){
    let total = cfg.plans.tsumekomi.basePrice;
    cfg.plans.tsumekomi.options.forEach(o=>{
      if(o.type === "fixed" && s.fixedSelected[o.id]) total += o.price;
      if(o.type === "quantity"){
        const q = s.quantities[o.id] || 0;
        total += q * o.price;
      }
    });
    return total;
  }
  return 0;
}
// ミニキャラLive2d部分の合計（全力/詰め込みプランとは独立して加算される）
function miniCharaTotal(){
  const s = state.live2d.miniChara;
  if(!s.selected) return 0;
  const cfg = SITE_CONFIG.live2d.miniChara;
  let total = cfg.basePrice;
  cfg.options.forEach(o=>{
    if(o.type === "fixed" && s.fixedSelected[o.id]) total += o.price;
    if(o.type === "quantity"){
      const q = s.quantities[o.id] || 0;
      total += q * o.price;
    }
  });
  return total;
}
// 全体の合計（メインプラン＋ミニキャラLive2d）
function live2dTotal(){
  return live2dMainPlanTotal() + miniCharaTotal();
}

function selectPlan(planId){
  state.live2d.plan = state.live2d.plan === planId ? null : planId;

function toggleFixed(id){

  state.live2d.fixedSelected[id] = !state.live2d.fixedSelected[id];

function changeQty(id, delta){
  if(state.live2d.plan !== "tsumekomi") return;
  const cur = state.live2d.quantities[id] || 0;
  const next = Math.max(0, cur + delta);
  state.live2d.quantities[id] = next;

}

  state.live2d.miniChara.selected = !state.live2d.miniChara.selected;
  renderPage();
}
function toggleMiniFixed(id){
  if(!state.live2d.miniChara.selected) return;
  state.live2d.miniChara.fixedSelected[id] = !state.live2d.miniChara.fixedSelected[id];
  renderPage();
}
function changeMiniQty(id, delta){
  if(!state.live2d.miniChara.selected) return;
  const cur = state.live2d.miniChara.quantities[id] || 0;
  const next = Math.max(0, cur + delta);
  state.live2d.miniChara.quantities[id] = next;
  renderPage();
}

function installmentHTML(total, count){
  if(total <= 0) return "";
  const base = Math.floor(total / count);
  const remainder = total - base*count;
  const parts = Array.from({length:count}, (_,i)=> base + (i < remainder ? 1 : 0));
  return `<div class="installments">最大${count}回払い：${parts.map(p=>`<b>${yen(p)}</b>`).join(" ＋ ")}</div>`;
}

function generateLive2DText(){
  const s = state.live2d;
  const cfg = SITE_CONFIG.live2d;
  const lines = [];

  if(s.plan === "zenryoku"){
    lines.push(`${cfg.plans.zenryoku.name}　${cfg.plans.zenryoku.price.toLocaleString("ja-JP")}円`);
  } else if(s.plan === "tsumekomi"){
    lines.push(`${cfg.plans.tsumekomi.name}　${cfg.plans.tsumekomi.basePrice.toLocaleString("ja-JP")}円`);
    cfg.plans.tsumekomi.options.forEach(o=>{
      if(o.type === "fixed" && s.fixedSelected[o.id]){
        lines.push(`${o.name}　${o.price.toLocaleString("ja-JP")}円`);
      }
      if(o.type === "quantity" && (s.quantities[o.id]||0) > 0){
        const q = s.quantities[o.id];
        lines.push(`${o.name}　${o.price.toLocaleString("ja-JP")}円 × ${q}${o.unit||""}`);
      }
    });
  }

  if(s.miniChara.selected){
    lines.push(`${cfg.miniChara.name}　${cfg.miniChara.basePrice.toLocaleString("ja-JP")}円`);
    cfg.miniChara.options.forEach(o=>{
      if(o.type === "fixed" && s.miniChara.fixedSelected[o.id]){
        lines.push(`${o.name}　${o.price.toLocaleString("ja-JP")}円`);
      }
      if(o.type === "quantity" && (s.miniChara.quantities[o.id]||0) > 0){
        const q = s.miniChara.quantities[o.id];
        lines.push(`${o.name}　${o.price.toLocaleString("ja-JP")}円 × ${q}${o.unit||""}`);
      }
    });
  }

  if(lines.length === 0) return "プランを選択すると、ここに依頼文が表示されます。";

  const total = live2dTotal();

  return [
    "-----------",
    "■ ご希望のプラン",
    lines.join("\n"),
    "■ お見積り",
    `${total.toLocaleString("ja-JP")}円`,
    "■ 希望納期",
    deliveryDisplay("live2d"),
    "■ その他要望",
    s.otherRequest ? s.otherRequest : "特になし",
    "-----------"
  ].join("\n");
}

function selectRequestItem(pageKey, val){
  state[pageKey].item = val;
  renderPage();
}

// 「希望制作物」の選択肢を、料金表のデータから自動的に組み立てる。
// design: 料金表(prices)の項目をそのまま選択肢＋見積りにする。
// video: 料金表の項目名と希望制作物の項目名が異なるため、config.js の
//        video.requestOptions（name / estimate）をそのまま使う。
function getRequestOptions(pageKey){
  const cfg = SITE_CONFIG[pageKey];
  if(pageKey === "design"){
    return cfg.prices
      .map(p => ({ name: p.name, estimate: yen(p.price) }))
      .concat([{ name: "その他", estimate: "ご相談" }]);
  }
  return cfg.requestOptions;
}

function generateSimpleText(pageKey){
  const s = state[pageKey];
  const options = getRequestOptions(pageKey);
  const itemLabel = s.item === "その他" ? (s.itemOther || "（未入力）") : (s.item || "（未選択）");
  const matched = options.find(o => o.name === s.item);
  const estimateLabel = (!s.item || s.item === "その他") ? "ご相談" : (matched ? matched.estimate : "ご相談");
  return [
    "-----------",
    "■ ご希望の制作物",
    itemLabel,
    "■ お見積り",
    estimateLabel,
    "■ 希望納期",
    deliveryDisplay(pageKey),
    "■ その他要望",
    s.otherRequest ? s.otherRequest : "特になし",
    "-----------"
  ].join("\n");
}
